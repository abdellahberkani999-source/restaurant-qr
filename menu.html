<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>منيو مطعم مينا</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <div>
        <h1>🍽️ مطعم مينا</h1>
        <span id="tableNumber">الطاولة</span>
    </div>

    <button class="cart-button" onclick="openCart()">
        🛒
        <span id="cartCount">0</span>
    </button>

</header>


<main>

    <section class="welcome">

        <h2>أهلاً وسهلاً 👋</h2>

        <p>
            اختار واش تحب وابعث طلبك مباشرة للمطعم.
        </p>

    </section>


    <div class="categories">

        <button onclick="filterCategory('all')">
            الكل
        </button>

        <button onclick="filterCategory('pizza')">
            🍕 بيتزا
        </button>

        <button onclick="filterCategory('burger')">
            🍔 برغر
        </button>

        <button onclick="filterCategory('drink')">
            🥤 مشروبات
        </button>

    </div>


    <section id="products" class="products"></section>

</main>


<!-- السلة -->

<div id="cartModal" class="modal">

    <div class="modal-content">

        <button class="close" onclick="closeCart()">
            ×
        </button>

        <h2>🛒 طلبك</h2>

        <div id="cartItems"></div>

        <div class="total">

            <span>المجموع:</span>

            <strong id="cartTotal">
                0 دج
            </strong>

        </div>

        <button class="order-btn" onclick="sendOrder()">
            إرسال الطلب
        </button>

    </div>

</div>


<script type="module" src="script.js"></script>

</body>

</html>
